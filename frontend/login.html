<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso - Control Domótico</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .video-wrapper { position: relative; display: inline-block; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; }
        .control-panel { display: none; background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 600px;}
        .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .btn-domotica { padding: 20px; font-size: 1.2rem; flex-direction: column; gap: 10px; }
        .btn-domotica i { font-size: 2rem; }
    </style>
</head>
<body>
    
    <!-- PANTALLA DE RECONOCIMIENTO -->
    <div id="pantalla-reconocimiento" class="login-container">
        <h1 style="margin-bottom: 10px;">Escaneo Facial</h1>
        <p id="estado-login" style="margin-bottom: 30px; color: var(--text-secondary);">Cargando sistema de IA...</p>
        
        <div class="video-wrapper">
            <video id="video-login" width="640" height="480" autoplay muted></video>
            <canvas id="canvas-login" style="position: absolute; top: 0; left: 0;"></canvas>
        </div>
    </div>

    <!-- PANTALLA DE CONTROL (Se muestra tras reconocer el rostro) -->
    <div id="pantalla-control" class="login-container" style="display: none;">
        <div class="control-panel">
            <h1 id="bienvenida-usuario">Bienvenido</h1>
            <p style="color: var(--success-color);"><i class="fa-solid fa-circle-check"></i> Identidad Verificada</p>
            
            <div class="grid-botones">
                <button class="btn btn-primary btn-domotica" onclick="enviarComando('ABRIR_PUERTA')">
                    <i class="fa-solid fa-door-open"></i> Abrir Puerta
                </button>
                <button class="btn btn-primary btn-domotica" onclick="enviarComando('LUCES_ON')" style="background-color: #f59e0b;">
                    <i class="fa-solid fa-lightbulb"></i> Encender Luces
                </button>
                <button class="btn btn-secondary btn-domotica" onclick="enviarComando('LUCES_OFF')">
                    <i class="fa-regular fa-lightbulb"></i> Apagar Luces
                </button>
                <button class="btn btn-primary btn-domotica" onclick="enviarComando('BOMBA_ON')" style="background-color: #06b6d4;">
                    <i class="fa-solid fa-water"></i> Activar Bomba
                </button>
                <button class="btn btn-secondary btn-domotica" onclick="enviarComando('BOMBA_OFF')">
                    <i class="fa-solid fa-droplet-slash"></i> Apagar Bomba
                </button>
            </div>
            
            <button class="btn btn-danger w-100" style="margin-top: 30px;" onclick="cerrarSesion()">Cerrar Sesión / Volver a escanear</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
